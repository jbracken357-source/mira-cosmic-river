<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Mira Cosmic River favicon - Binary star system -->
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#0a0612"/>

  <!-- Mira A - Primary orange star -->
  <circle cx="10" cy="16" r="4" fill="#ff6b35" opacity="0.9"/>
  <circle cx="10" cy="16" r="6" fill="#ff6b35" opacity="0.2"/>

  <!-- Mira B - Secondary blue-white star -->
  <circle cx="22" cy="16" r="2" fill="#60a5fa" opacity="0.9"/>
  <circle cx="22" cy="16" r="3.5" fill="#60a5fa" opacity="0.2"/>

  <!-- Orbit hint -->
  <ellipse cx="16" cy="16" rx="8" ry="3" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>

  <!-- Material stream hint -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#fef3c7" stroke-width="0.5" opacity="0.3"/>
</svg>