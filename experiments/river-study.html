<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mira · 光河材质实验</title>
    <style>
      * { box-sizing: border-box; } body { margin: 0; background: #03050d; color: #eae5df; font: 14px/1.7 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100dvh; touch-action: none; }
      aside { position: fixed; left: 6vw; top: 6vh; pointer-events: none; }
      h1 { font-size: clamp(22px, 4vw, 38px); font-weight: 300; letter-spacing: .2em; margin: 0 0 8px; }
      p { margin: 0; opacity: .65; } footer { position: fixed; bottom: 5vh; width: 100%; text-align: center; pointer-events: none; opacity: .5; font-size: 12px; }
    </style>
  </head>
  <body>
    <aside><h1>一起，走向更远。</h1><p id="status">光河正在浮现</p></aside>
    <canvas aria-label="可拖动旋转的双星光河材质实验"></canvas>
    <footer>拖动观看 · 滚轮拉近与远离</footer>
    <script type="module" src="./river-study.ts"></script>
  </body>
</html>
