<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mira · 去塑料感 Wayfinder</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #02030a; color: #eee9e3; font: 14px/1.6 Inter, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100dvh; touch-action: none; }
      body::after {
        content: ""; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 56% 47%, transparent 28%, rgb(1 2 8 / .18) 58%, rgb(0 0 4 / .72) 100%);
        mix-blend-mode: multiply;
      }
      aside { position: fixed; z-index: 2; left: max(24px, 5vw); top: max(24px, 5vh); width: min(430px, 80vw); pointer-events: none; }
      .prototype { margin: 0 0 10px; color: #c8ae82; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; opacity: .72; }
      h1 { font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(24px, 4vw, 48px); font-weight: 400; letter-spacing: .08em; line-height: 1.15; margin: 0 0 10px; }
      #status { margin: 0; max-width: 38ch; color: rgb(238 233 227 / .58); font-weight: 300; }
      #metrics { margin-top: 12px; color: rgb(238 233 227 / .34); font: 10px/1.6 ui-monospace, monospace; letter-spacing: .08em; }
      nav {
        position: fixed; z-index: 4; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px; padding: 7px;
        background: rgb(8 9 15 / .82); border: 1px solid rgb(255 255 255 / .16); border-radius: 999px;
        box-shadow: 0 12px 44px rgb(0 0 0 / .52); backdrop-filter: blur(18px);
      }
      nav button { min-width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; color: rgb(255 255 255 / .65); cursor: pointer; font: inherit; }
      nav button:hover, nav button:focus-visible { color: white; background: rgb(255 255 255 / .09); outline: none; }
      #variant-label { min-width: min(46vw, 250px); text-align: center; font-size: 12px; letter-spacing: .08em; color: rgb(255 255 255 / .82); }
      @media (max-width: 600px) {
        aside { width: 72vw; }
        h1 { font-size: 25px; }
        #status { font-size: 12px; }
        #metrics { display: none; }
        #variant-label { min-width: 190px; }
      }
    </style>
  </head>
  <body data-prototype="throwaway">
    <aside>
      <p class="prototype">Throwaway prototype · Wayfinder</p>
      <h1 id="title">去掉塑料感</h1>
      <p id="status">正在建立光河</p>
      <p id="metrics">QUESTION — 哪一种空间结构最接近“浪漫、震撼、可信的光河”？</p>
    </aside>
    <canvas role="img" aria-label="可拖动旋转的 Mira 双星与光河视觉原型"></canvas>
    <nav aria-label="原型变体切换">
      <button id="previous" aria-label="上一个变体">←</button>
      <span id="variant-label" aria-live="polite"></span>
      <button id="next" aria-label="下一个变体">→</button>
    </nav>
    <script type="module" src="./river-study.ts"></script>
  </body>
</html>
