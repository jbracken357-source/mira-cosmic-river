name: Manual CI

# A dispatch-only mirror of ci.yml's job: today's incident dropped this repo's
# pull_request runs for hours while push events flowed, and the dispatch
# registration on the long-lived ci.yml refused to refresh. A freshly created
# workflow file registers its trigger on creation, which sidesteps the stale
# index. The job content mirrors ci.yml — keep the two in step by hand until
# the pull_request line is trustworthy again, then delete this file.
on:
  workflow_dispatch:

jobs:
  checks:
    name: lint + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
