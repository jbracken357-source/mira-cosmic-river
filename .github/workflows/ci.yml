name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual dispatch: today's GitHub incident dropped this repo's pull_request
  # events for hours while push events flowed; dispatch keeps the suite runnable
  # on a branch ref when that happens again. Gate merges on the run's
  # conclusion either way.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + build + unit
    # Pinned (2026-11-04): ubuntu-latest moved to 26.04, and Playwright 1.59.1
    # refuses to install chromium there ("does not support chromium on
    # ubuntu26.04-x64"). Unpin once a Playwright release supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Pure Node specs: no browser to install.
      - name: Unit tests
        run: npm run test:unit

  smoke:
    name: production smoke
    # The e2e suite drives the dev server through dev-only seams (?epoch=,
    # ?capture=1, ?quality-probe). This job is the only one that runs the bundle
    # Vercel ships (#136). Pinned to 24.04 for the same reason as the jobs above.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # #141: shows which file holds the Microsoft source before the fix names it.
      - name: List the apt sources the runner ships
        run: |
          ls -la /etc/apt/sources.list.d/
          grep -rn -E '^(deb |URIs:)' /etc/apt/sources.list /etc/apt/sources.list.d/ || true

      # #141: the runner image ships a Microsoft apt source that the browser
      # dependencies do not need. When it answers 403, the `apt-get update`
      # inside `--with-deps` exits 100 before any test runs. This job points
      # that host at the loopback address, so the source fails on every run.
      - name: Force the Microsoft apt source to fail
        run: |
          printf '127.0.0.1 packages.microsoft.com\n::1 packages.microsoft.com\n' | sudo tee -a /etc/hosts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke-test the production build
        run: |
          base=http://127.0.0.1:4173
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          # A failed attempt is expected while the preview starts, so this one is quiet.
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$base/" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          # Fails the step, with curl's reason, if the preview never came up.
          curl --silent --show-error --fail "$base/" > /dev/null
          node experiments/smoke-production.mjs "$base"

  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # One runner per job keeps one WebGL context per machine, as the config
    # demands. The serial suite took ~23m on one runner (#132); split four ways,
    # each job holds about 6m of tests. The wall exists to catch hangs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: e2e 1/3, args: --shard=1/3 --grep-invert "real idle timing" }
          - { name: e2e 2/3, args: --shard=2/3 --grep-invert "real idle timing" }
          - { name: e2e 3/3, args: --shard=3/3 --grep-invert "real idle timing" }
          # The #115 epilogue checks wait the real 60s each (~5m in all): they
          # get their own runner so they never make one shard the long pole.
          - { name: e2e real idle timing, args: --grep "real idle timing" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --project=chromium ${{ matrix.args }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7
