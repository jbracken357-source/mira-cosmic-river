name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual dispatch: today's GitHub incident dropped this repo's pull_request
  # events for hours while push events flowed; dispatch keeps the suite runnable
  # on a branch ref when that happens again. Gate merges on the run's
  # conclusion either way.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + build + unit
    # Pinned (2026-11-04): ubuntu-latest moved to 26.04, and Playwright 1.59.1
    # refuses to install chromium there ("does not support chromium on
    # ubuntu26.04-x64"). Unpin once a Playwright release supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Pure Node specs: no browser to install.
      - name: Unit tests
        run: npx playwright test --project=unit

  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # One runner per job keeps one WebGL context per machine, as the config
    # demands. The serial suite took ~23m on one runner (#132); split four ways,
    # each job holds about 6m of tests. The wall exists to catch hangs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: e2e 1/3, args: --shard=1/3 --grep-invert "real idle timing" }
          - { name: e2e 2/3, args: --shard=2/3 --grep-invert "real idle timing" }
          - { name: e2e 3/3, args: --shard=3/3 --grep-invert "real idle timing" }
          # The #115 epilogue checks wait the real 60s each (~5m in all): they
          # get their own runner so they never make one shard the long pole.
          - { name: e2e real idle timing, args: --grep "real idle timing" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --project=chromium ${{ matrix.args }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7
