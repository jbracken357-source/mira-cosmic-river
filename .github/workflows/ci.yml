name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual dispatch: today's GitHub incident dropped this repo's pull_request
  # events for hours while push events flowed; dispatch keeps the suite runnable
  # on a branch ref when that happens again. Gate merges on the run's
  # conclusion either way.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + build + e2e
    runs-on: ubuntu-latest
    # The suite alone runs ~14.5m under CI's software GL and every PR adds a little
    # more; at 15 the wall cancelled #104's run AFTER all 494 tests had passed,
    # mid-report-upload. 20 held until the suite reached ~557 tests (#108–#115),
    # then the wall cancelled two master runs mid-suite at 20m21s and 21m46s.
    # 25 leaves room for the suite plus setup and the report.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
